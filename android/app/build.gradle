apply plugin: 'com.android.application'

android {
    namespace = "com.travelmap.app"
    compileSdk = rootProject.ext.compileSdkVersion
    
    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            storeFile file("release-key.jks")
            storePassword "travelmap2024"
            keyAlias "release-key"
            keyPassword "travelmap2024"
        }
    }
    
    defaultConfig {
        applicationId "com.travelmap.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 32
        versionName "1.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// AGP는 minSdkVersion >= 24이면 v1(JAR) 서명을 자동으로 생략합니다.
// 일부 카카오 SDK/카카오톡 버전이 구버전 PackageManager.GET_SIGNATURES(v1 전용)로
// 서명 인증서를 조회하는 경우가 있어, 호환성을 위해 APK에 v1 서명을 강제로 추가합니다.
android.applicationVariants.all { variant ->
    def variantName = variant.name.capitalize()
    def signingCfg = variant.signingConfig
    if (signingCfg == null) return
    tasks.register("forceV1Signing${variantName}") {
        dependsOn "assemble${variantName}"
        doLast {
            variant.outputs.each { output ->
                def apkFile = output.outputFile
                if (apkFile == null || !apkFile.exists()) return
                def buildToolsDir = new File(android.sdkDirectory, "build-tools").listFiles()
                        .sort { it.name }.last()
                def apksigner = new File(buildToolsDir, "apksigner").absolutePath
                def cmd = [apksigner, "sign",
                        "--ks", signingCfg.storeFile.absolutePath,
                        "--ks-pass", "pass:${signingCfg.storePassword}",
                        "--ks-key-alias", signingCfg.keyAlias,
                        "--key-pass", "pass:${signingCfg.keyPassword}",
                        "--min-sdk-version", "21",
                        "--v1-signing-enabled", "true",
                        "--v2-signing-enabled", "true",
                        "--v3-signing-enabled", "true",
                        apkFile.absolutePath]
                def proc = new ProcessBuilder(cmd.collect { it.toString() }).redirectErrorStream(true).start()
                def out = proc.inputStream.text
                def code = proc.waitFor()
                if (code != 0) {
                    throw new GradleException("forceV1Signing failed (exit ${code}):\n${out}")
                }
            }
        }
    }
    variant.assembleProvider.configure {
        finalizedBy "forceV1Signing${variantName}"
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
