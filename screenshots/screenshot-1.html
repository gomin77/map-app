<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여정 - 스크린샷 1</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:80px 20px 40px}
  .container{max-width:600px;width:100%;text-align:center}
  .title{font-size:80px;font-weight:800;color:#fff;margin-bottom:16px;line-height:1.2;text-shadow:0 2px 10px rgba(0,0,0,0.2)}
  .subtitle{font-size:68px;color:rgba(255,255,255,0.9);margin-bottom:24px;line-height:1.4}
  .phone-frame{background:#1a1a1a;border-radius:40px;padding:12px;box-shadow:0 25px 60px rgba(0,0,0,0.4), 0 10px 20px rgba(0,0,0,0.2);max-width:500px;margin:0 auto;transform:scale(2.5);transform-origin:center top;margin-top:200px;margin-bottom:200px}
  .phone-screen{background:#f5f0ea;border-radius:28px;overflow:hidden;position:relative}
  .phone-screen img{width:100%;height:auto;display:block}
  .feature-tag{display:inline-block;background:rgba(255,255,255,0.2);color:#fff;font-size:20px;font-weight:700;padding:10px 28px;border-radius:24px;margin-top:40px;backdrop-filter:blur(10px)}
</style>
</head>
<body>
<div class="container">
  <div class="title">간편하게<br>시작하세요</div>
  <div class="subtitle">카카오 / 구글로<br>3초 만에 로그인</div>
  <div class="phone-frame">
    <div class="phone-screen">
      <img src="shot1.png" alt="간편 로그인">
    </div>
  </div>
  <div class="feature-tag">🔐 간편 로그인</div>
</div>
</body>
</html>
