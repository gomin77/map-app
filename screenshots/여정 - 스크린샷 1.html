<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여정 - 스크린샷 1</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
  .container{max-width:400px;width:100%;text-align:center}
  .title{font-size:36px;font-weight:800;color:#fff;margin-bottom:16px;line-height:1.3;text-shadow:0 2px 10px rgba(0,0,0,0.2)}
  .subtitle{font-size:18px;color:rgba(255,255,255,0.9);margin-bottom:40px;line-height:1.5}
  .phone-frame{background:#1a1a1a;border-radius:40px;padding:12px;box-shadow:0 25px 60px rgba(0,0,0,0.4), 0 10px 20px rgba(0,0,0,0.2);max-width:320px;margin:0 auto}
  .phone-screen{background:#f5f0ea;border-radius:28px;overflow:hidden;position:relative}
  .phone-screen img{width:100%;height:auto;display:block}
  .feature-tag{display:inline-block;background:rgba(255,255,255,0.2);color:#fff;font-size:14px;font-weight:700;padding:8px 20px;border-radius:20px;margin-top:30px;backdrop-filter:blur(10px)}
</style>
</head>
<body>
<div class="container">
  <div class="title">간편하게<br>시작하세요</div>
  <div class="subtitle">카카오 / 구글로<br>3초 만에 로그인</div>
  <div class="phone-frame">
    <div class="phone-screen">
      <img src="shot1.png" alt="간편 로그인">
    </div>
  </div>
  <div class="feature-tag">🔐 간편 로그인</div>
</div>
</body>
</html>
